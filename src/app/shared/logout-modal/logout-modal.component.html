@if (open) {
  <div class="modal-overlay" (click)="onOverlayClick()">
    <div class="modal-card logout-modal-card" (click)="onCardClick($event)">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>

      <h3 class="modal-title">{{ title }}</h3>
      <p class="modal-description">{{ description }}</p>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">{{ cancelText }}</button>
        <button type="button" class="btn-confirm" (click)="onConfirm()">{{ confirmText }}</button>
      </div>
    </div>
  </div>
}
